[package]
name = "@skiffyard/d64"
version = "0.4.0"
description = "Read, write, create and format Commodore 1541 D64 disk images: CBM DOS 2A directories, BAM allocation, PETSCII names, and the 40-track SpeedDOS / DolphinDOS / PrologicDOS extensions"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
capabilities = []
keywords = [
    "d64",
    "commodore",
    "c64",
    "1541",
    "cbm-dos",
    "disk-image",
    "petscii",
    "retrocomputing",
]

[package.urls]
deck = "https://raw.githubusercontent.com/skiffyard/deck-d64/main/deck.toml"
homepage = "https://github.com/skiffyard/deck-d64"
manual = "https://skiffyard.github.io/deck-d64/"

[engines]
jennifer = ">=0.27.0"
jennifer-tiny = ">=0.27.0"
