# Grimoire book configuration for the @deckyard/d64 documentation.

[book]
title = "@deckyard/d64"
description = "Read, write, create and format Commodore 1541 D64 disk images from Jennifer."
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-d64/"
repoUrl = "https://github.com/deckyard/deck-d64"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-d64/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/deckyard">Deckyard</a>, community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
